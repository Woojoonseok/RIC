services:
  db:
    image: postgres:16
    container_name: ric-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ric
      POSTGRES_PASSWORD: ric
      POSTGRES_DB: ric
    ports:
      - "5432:5432"
    volumes:
      - ric-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ric -d ric"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ric-postgres-data:
